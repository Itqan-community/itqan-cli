name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.ZrcN` for a pre-release) whose version matches
# pyproject.toml. See RELEASING.md.
# Publishes to PyPI, then creates the GitHub Release with the sdist, wheel, standalone
# binaries (binaries.yml) and SHA256SUMS, then publishes to npm (npm.yml) and pub.dev (dart.yml)
# and updates the Homebrew tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tags since v8

      - name: Check the tag matches the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Smoke-test the wheel
        run: uv tool run --from ./dist/*.whl itqan --version

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  binaries:
    needs: build
    uses: ./.github/workflows/binaries.yml

  npm:
    needs: binaries
    uses: ./.github/workflows/npm.yml

  dart:
    needs: binaries
    uses: ./.github/workflows/dart.yml

  publish-pypi:
    # Wait for the binaries, npm and Dart packages too, so a release is published everywhere or nowhere.
    needs: [build, binaries, npm, dart]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/itqan-cli/
    permissions:
      id-token: write  # trusted publishing: PyPI accepts this workflow's identity, no token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease

  homebrew:
    # Point `brew install itqan-community/tap/itqan` at the new binaries. Pre-releases stay out
    # of the tap. Pushes with a deploy key that has write access to the tap; see RELEASING.md.
    needs: github-release
    if: ${{ !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Itqan-community/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          python3 scripts/homebrew_formula.py "$version" "$RUNNER_TEMP/SHA256SUMS" > tap/Formula/itqan.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/itqan.rb
          git diff --cached --quiet && exit 0
          git commit -m "itqan $version"
          git push

  publish-npm:
    # Platform packages first, so `itqan-cli`'s optional dependencies exist when it appears.
    # Pre-releases go under the `next` dist-tag, so `npx itqan-cli` keeps the latest final release.
    # Packages already at this version are skipped, so a failed run can be re-run.
    needs: github-release
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/itqan-cli
    permissions:
      id-token: write  # trusted publishing: npm accepts this workflow's identity, no token stored
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-dist/
      - name: Publish
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then tag=next; fi
          # The leading ./ matters: npm reads `npm-dist/x.tgz` as the GitHub repo npm-dist/x.tgz.
          for tarball in ./npm-dist/itqan-community-cli-*.tgz ./npm-dist/itqan-cli-*.tgz; do
            spec="$(tar -xzOf "$tarball" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); p.name + "@" + p.version')"
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
              continue
            fi
            npm publish "$tarball" --access public --tag "$tag"
          done

  publish-pub:
    # pub.dev only accepts a tag matching its `v{{version}}` pattern, and a pre-release's pub
    # version (0.2.0-rc.1) doesn't match its tag (v0.2.0rc1), so pre-releases stay off pub.dev.
    # Skips a version that is already published, so a failed run can be re-run.
    needs: github-release
    if: ${{ !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-24.04
    environment:
      name: pub.dev
      url: https://pub.dev/packages/itqan_cli
    permissions:
      id-token: write  # automated publishing: pub.dev accepts this workflow's identity, no token stored
    steps:
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v8
        with:
          name: dart-package
          path: dart-package/
      - name: Publish
        working-directory: dart-package
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsS -o /dev/null "https://pub.dev/api/packages/itqan_cli/versions/$version"; then
            echo "itqan_cli $version is already published"
            exit 0
          fi
          dart pub publish --force
