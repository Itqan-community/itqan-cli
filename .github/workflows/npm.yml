name: npm

# The npm packages (scripts/npm_packages.py): `itqan-cli` and one package per platform holding its
# binary. Called after binaries.yml by ci.yml and release.yml; release.yml publishes the
# `npm-packages` artifact.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: bin/
          merge-multiple: true
      - name: Build and pack
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir npm-dist
          python3 scripts/npm_packages.py "$version" bin npm-build | while read -r folder; do
            (cd npm-dist && npm pack "../$folder")
          done
          ls -l npm-dist
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm-dist/
          if-no-files-found: error

  smoke:
    # Install the packed packages into an empty project, as a user would, and run `itqan`.
    name: smoke ${{ matrix.platform }}
    needs: pack
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: ubuntu-22.04, platform: linux-x64 }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64 }
          - { runner: windows-2022, platform: win32-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-dist/
      - name: Install and run
        run: |
          set -x
          mkdir "$RUNNER_TEMP/project"
          # Relative paths, which npm understands on Windows too.
          cp npm-dist/itqan-cli-*.tgz npm-dist/itqan-community-cli-${{ matrix.platform }}-*.tgz "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm init -y
          npm pkg set scripts.assets="itqan install"
          # Only this platform's package is installed from a local file; the other optional
          # dependencies may not be on npm yet, and npm skips them.
          npm install --save-dev ./*.tgz
          npx --no-install itqan --version
          npx --no-install itqan-cli --help
          export ITQAN_CONFIG_DIR="$RUNNER_TEMP/itqan-config"
          npx --no-install itqan init
          npm run assets
          test -f itqan-assets.lock
