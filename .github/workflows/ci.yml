name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tags since v8
        with:
          cache-suffix: test-${{ matrix.python-version }}  # one cache per job, so they don't race to save it
      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tags since v8
        with:
          cache-suffix: build
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: uv tool run --from ./dist/*.whl itqan --version

  binaries:
    uses: ./.github/workflows/binaries.yml

  npm:
    needs: binaries
    uses: ./.github/workflows/npm.yml

  dart:
    needs: binaries
    uses: ./.github/workflows/dart.yml
