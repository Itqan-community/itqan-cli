[project]
name = "itqan-cli"
version = "0.1.0rc1"
description = "Itqan Quranic Asset Manager: install and pin Itqan Quranic assets in your project."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Hassaan Alansary", email = "hassaanalansary@yahoo.com" },
    { name = "Itqan" },
]
keywords = ["itqan", "quran", "quranic", "tafsir", "mushaf", "assets", "package-manager", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Religion",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "questionary>=2.1",
    "requests>=2.31",
]

[project.scripts]
itqan = "itqan_cli.main:cli"
# Same CLI under the package name, so `pipx install itqan-cli` then `itqan-cli ...` works too.
itqan-cli = "itqan_cli.main:cli"

[project.urls]
Homepage = "https://github.com/Itqan-community/itqan-cli"
Repository = "https://github.com/Itqan-community/itqan-cli"
Issues = "https://github.com/Itqan-community/itqan-cli/issues"
"Manifest format" = "https://github.com/Itqan-community/cms-backend/blob/main/docs/ASSET_MANIFEST.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The source archive is for building and testing the package, not for
# developing it: leave out CI, editor and lock files.
exclude = [".github", ".pre-commit-config.yaml", "uv.lock", ".idea"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["itqan_cli"]
force_sort_within_sections = true
combine_as_imports = true
