[project]
name = "itqan-cli"
version = "0.1.0"
description = "Install and pin Itqan Quranic assets in your project."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
itqan = "itqan_cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["itqan_cli"]
force_sort_within_sections = true
combine_as_imports = true
